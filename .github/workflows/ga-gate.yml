name: ga-gate

# Integration gate only. Unit, lint and build checks live in backend-ci and
# frontend-ci; this workflow proves the assembled core stack can boot and serve.
on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'itsm-backend/**'
      - 'itsm-frontend/**'
      - 'docker-compose.dev.yml'
      - 'scripts/smoke-test.sh'
      - 'scripts/ga-controlled-preparation.py'
      - 'scripts/fixtures/ga-minio-provision/**'
      - 'scripts/__tests__/test_ga_controlled_preparation.py'
      - '.github/workflows/ga-gate.yml'
  push:
    branches: [main]
    paths:
      - 'itsm-backend/**'
      - 'itsm-frontend/**'
      - 'docker-compose.dev.yml'
      - 'scripts/smoke-test.sh'
      - 'scripts/ga-controlled-preparation.py'
      - 'scripts/fixtures/ga-minio-provision/**'
      - 'scripts/__tests__/test_ga_controlled_preparation.py'
      - '.github/workflows/ga-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ga-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ga-approved:
    name: GA Gate · Approved
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEPLOYMENT_MODE: private
      ITSM_FRONTEND_URL: http://localhost:3010
      # Compose interpolates inactive worker profiles; this job never starts it.
      KAF_WEBHOOK_URL: http://127.0.0.1:9/disabled-ci-worker
      KAF_WEBHOOK_SECRET: ci-only-unused-worker-secret-not-a-credential
      MAX_RETRIES: '120'
      RETRY_INTERVAL: '3'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose -f docker-compose.dev.yml --profile dev config --quiet

      - name: Set up migration CLI toolchain
        uses: actions/setup-go@v7
        with:
          go-version-file: itsm-backend/go.mod
          cache: true
          cache-dependency-path: itsm-backend/go.sum

      - name: Verify controlled preparation orchestration
        run: python3 -m unittest discover -s scripts/__tests__ -p test_ga_controlled_preparation.py

      - name: Verify explicit storage provisioning
        working-directory: itsm-backend
        run: go test ../scripts/fixtures/ga-minio-provision/main.go ../scripts/fixtures/ga-minio-provision/main_test.go

      - name: Prepare disposable database and start core stack
        run: python3 scripts/ga-controlled-preparation.py prepare

      - name: Wait for backend and frontend
        run: |
          for attempt in $(seq 1 60); do
            backend_status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8090/api/v1/health || true)
            frontend_status=$(curl -s -o /dev/null -w '%{http_code}' "$ITSM_FRONTEND_URL/api/health" || true)
            if [ "$backend_status" = '200' ] && [ "$frontend_status" = '200' ]; then
              echo "Core stack ready after ${attempt} attempts"
              exit 0
            fi
            sleep 5
          done
          echo '::error::Core stack did not become healthy in time'
          exit 1

      - name: Run API smoke tests
        run: |
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh

      - name: Upload failure logs
        if: failure()
        run: python3 scripts/ga-controlled-preparation.py logs > ga-gate-compose.log

      - name: Save redacted logs and preparation summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ga-gate-evidence
          path: |
            ga-gate-compose.log
            ga-gate-preparation-summary.json
          retention-days: 7

      - name: Tear down
        if: always()
        run: python3 scripts/ga-controlled-preparation.py cleanup
