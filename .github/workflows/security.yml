name: Security Scan

# Purpose:
#   Run security-focused scans that are separate from normal build/test CI.
# Notes:
#   - gosec and Trivy upload SARIF to the GitHub Security tab.
#   - npm audit is limited to production dependencies and critical severity
#     so historical dev/high advisories do not block every routine change.
#   - TruffleHog scans for accidental secret exposure.

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday at 6am
  workflow_dispatch:

permissions:
  security-events: write
  contents: read

jobs:
  gosec:
    name: Go Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: itsm-backend/go.mod
          cache: true
          cache-dependency-path: itsm-backend/go.sum

      - name: Run gosec
        uses: securego/gosec@master
        env:
          # Bound analyzer/package-loader memory after repeated runner shutdowns.
          GOMAXPROCS: '2'
          GOMEMLIMIT: 2GiB
          GOFLAGS: -p=2
        with:
          args: '-concurrency 2 -no-fail -fmt sarif -out gosec-results.sarif ./itsm-backend/...'

      - name: Upload gosec results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec-results.sarif
          category: gosec

  trivy-report:
    name: Trivy Vulnerability Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy

  trivy-gate:
    name: Trivy Gate (Critical Only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Trivy gate
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'

  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: itsm-backend/go.mod
          cache: true
          cache-dependency-path: itsm-backend/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      # Time-boxed advisory exclusion (maintainer-approved 2026-09-18).
      #
      # GO-2026-6452 (github.com/xuri/excelize/v2, "panic via negative shared-string
      # index") has NO fixed release: vuln.go.dev lists the affected range as
      # introduced "0" with no `fixed` event, and the vulnerable symbol
      # (excelize.File.GetRows) is still reachable in v2.11.0, the newest published
      # version. The only reachable trace is the operator-run batch CLI
      # itsm-backend/cmd/sync_ehr_master_data. Impact is a panic on a malformed
      # workbook (denial of service of that CLI), not code execution or data loss.
      #
      # REMOVAL CONDITION: delete the entry from ALLOWED_IDS below as soon as a fixed
      # excelize release exists (re-check https://pkg.go.dev/vuln/GO-2026-6452, which
      # must then list a `fixed` version), and restore the plain `govulncheck ./...`
      # invocation. Tracked in ROADMAP.md -> "Always-On Tracks" -> Security.
      #
      # govulncheck has no built-in way to silence a finding (go.dev/issue/61211)
      # and exits 0 in -json/-sarif mode regardless of findings, so the exclusion is
      # implemented here explicitly: text mode is run for its exit status, and the
      # reported advisory identifiers are compared against ALLOWED_IDS.
      #
      # Everything else stays fail-closed: any advisory not listed here fails the job,
      # and a govulncheck status other than 0 (clean) or 3 (findings) also fails the job.
      - name: Run govulncheck
        working-directory: itsm-backend
        run: |
          set -euo pipefail
          ALLOWED_IDS=(
            "GO-2026-6452"
          )

          report=$(mktemp)
          set +e
          govulncheck ./... > "$report" 2>&1
          status=$?
          set -e
          cat "$report"

          if [ "$status" -eq 0 ]; then
            echo "govulncheck: no vulnerabilities found."
            exit 0
          fi
          if [ "$status" -ne 3 ]; then
            echo "::error::govulncheck could not complete (exit status $status; 3 means findings); failing closed."
            exit 1
          fi

          found=$(grep -oE 'GO-[0-9]{4}-[0-9]{4,}' "$report" | sort -u)
          if [ -z "$found" ]; then
            echo "::error::govulncheck reported findings but no advisory identifiers were parsed; failing closed."
            exit 1
          fi

          unexpected=""
          while read -r id; do
            [ -z "$id" ] && continue
            allowed=0
            for entry in "${ALLOWED_IDS[@]}"; do
              [ "$id" = "$entry" ] && allowed=1
            done
            [ "$allowed" -eq 0 ] && unexpected="$unexpected $id"
          done <<< "$found"

          if [ -n "$unexpected" ]; then
            echo "::error::Unlisted Go vulnerability/vulnerabilities:$unexpected"
            exit 1
          fi

          echo "::warning::Time-boxed advisory exclusion in effect: $(printf '%s ' "${ALLOWED_IDS[@]}"). No fixed release exists yet; remove the exclusion once upstream ships a fix."

  npm-audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: itsm-frontend
        run: npm ci --legacy-peer-deps

      - name: Audit
        working-directory: itsm-frontend
        run: npm audit --omit=dev --audit-level=high

  pnpm-guard:
    name: pnpm Lockfile Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check for stale pnpm lockfile
        run: |
          if [ -f "itsm-frontend/pnpm-lock.yaml" ]; then
            echo "::error::Stale pnpm-lock.yaml detected. This project uses npm, not pnpm."
            exit 1
          fi

  secrets-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify fail-closed fixture handling
        run: node --test scripts/__tests__/secret-scan.test.js

      - name: Run TruffleHog with exact synthetic fixture review
        run: node scripts/secret-scan.js
